server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve the file if it exists, otherwise fall back to index.html so
  # client-side routes (vue-router) resolve on hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the API. The trailing slash on proxy_pass strips the `/api`
  # prefix, so `/api/auth/refresh` -> `backend:3000/auth/refresh`. Because the
  # browser only ever talks to this origin, there is no CORS and the httpOnly
  # refresh cookie flows as same-origin.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
