name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token — jobs only read the repo.
permissions:
  contents: read

# Cancel older runs for the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: install → prisma generate → build → test → openapi export ──
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci --reporters=default

      - name: E2E tests
        run: npm run test:e2e -- --ci --reporters=default

      # Advisory dependency scan — surfaces known CVEs without blocking the
      # pipeline yet. Tighten to a hard gate once the backlog is cleared.
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Verify the committed openapi.json is up to date with the source.
      - name: Verify openapi.json is in sync
        run: |
          npm run openapi
          if ! git diff --quiet openapi.json; then
            echo "::error::openapi.json is stale. Run 'npm run openapi && cd frontend && npm run generate:types' and commit the result."
            git --no-pager diff openapi.json
            exit 1
          fi

  # ─── Migrations: apply every migration to a REAL Postgres ────────────────
  # The e2e suite runs against an in-memory Prisma stub, so migrations are
  # otherwise never executed until production boot. This job catches broken or
  # conflicting migrations (and schema drift) against a fresh Postgres 16.
  migrations:
    name: Migrations (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: englishflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/englishflow_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Verify migrations are applied with no drift
        run: npx prisma migrate status

  # ─── Frontend: install → lint → type-check → build ───────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check
        working-directory: frontend

      - name: Type-check
        run: npm run type-check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ─── Mobile: pub get → analyze → test ────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install
        run: flutter pub get
        working-directory: mobile

      # `analyze` returns non-zero on errors; warnings/infos do not fail CI.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - name: Test
        run: flutter test --no-pub
        working-directory: mobile
