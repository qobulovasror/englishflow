name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs for the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: install → prisma generate → build → openapi export ─────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci --reporters=default

      - name: E2E tests
        run: npm run test:e2e -- --ci --reporters=default

      # Verify the committed openapi.json is up to date with the source.
      - name: Verify openapi.json is in sync
        run: |
          npm run openapi
          if ! git diff --quiet openapi.json; then
            echo "::error::openapi.json is stale. Run 'npm run openapi && cd frontend && npm run generate:types' and commit the result."
            git --no-pager diff openapi.json
            exit 1
          fi

  # ─── Frontend: install → type-check → build → verify generated types ─────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Verify generated types match openapi.json
        run: |
          npm run generate:types
          if ! git diff --quiet src/types/api.ts; then
            echo "::error::frontend/src/types/api.ts is stale. Run 'npm run generate:types' in frontend/ and commit."
            git --no-pager diff src/types/api.ts
            exit 1
          fi
        working-directory: frontend

      - name: Type-check
        run: npm run type-check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ─── Mobile: pub get → analyze → test ────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install
        run: flutter pub get
        working-directory: mobile

      # `analyze` returns non-zero on errors; warnings/infos do not fail CI.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - name: Test
        run: flutter test --no-pub
        working-directory: mobile
